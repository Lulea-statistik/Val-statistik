name: Import Röstdata v3
on:
  push:
    paths:
      - 'data/import/rostdata_v3.csv'
      - 'scripts/build_rostdata_v3.py'
      - '.github/workflows/import-rostdata-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and convert vote data
        run: python scripts/build_rostdata_v3.py
      - name: Publish GeoJSON-linked vote table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/roster/
          git diff --cached --quiet && exit 0
          git commit -m "Publish Röstdata v3 election vote data"
          git push
